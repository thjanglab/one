    <!--
      Not indexed on purpose: this page is handed out for a seminar, not
      published. A robots.txt would do nothing here — crawlers only read one
      at the domain root, which a project page does not own — so the meta
      tag is what actually keeps it out of results.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <title>국가 제조데이터 라이브러리 현황</title>
    <!--
      A page of its own, on purpose. The demo is a fixed 1600x900 artboard that
      styles html and body itself, and it carries no Tailwind: the platform's
      base stylesheet resets box-sizing, borders and line-height, which shifts
      the design off its intended metrics. Keeping the two apart is what makes
      the screens match the handoff pixel for pixel.
    -->
  </head>

    <script type="module" src="/gate.tsx"></script>
