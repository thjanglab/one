name: Vendor images

# Downloads the hot-linked Unsplash photos into the repository and commits
# them. Run manually: the app only needs this done once, and re-running it
# is a no-op because the source no longer points at images.unsplash.com.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download images and rewrite references
        run: node scripts/vendor-images.mjs

      - name: Commit the vendored images
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to commit - images are already vendored."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Vendor the Unsplash imagery into the repository

          The photos were hot-linked from images.unsplash.com, so they only
          appeared on networks that can reach that host. They are now served
          from the app itself, which makes the build self-contained.

          Downloaded by .github/workflows/vendor-images.yml."
          git push origin HEAD:${GITHUB_REF_NAME}
