name: Verify render & deploy

on:
  push:
    branches:
      - main
      - claude/run-program-qmahxu
      - claude/claude-design-demo-handover-qcsc0z
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Build and verify every screen renders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Serve the production build
        run: |
          npx vite preview --port 4173 --host 127.0.0.1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:4173 >/dev/null && echo "preview is up" && exit 0
            sleep 1
          done
          echo "preview server did not start" >&2
          exit 1

      - name: Verify every route renders
        run: npm run verify:render -- http://127.0.0.1:4173

      - name: Upload render report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-report
          path: render-report/

      - name: Package the site for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # Last step on purpose: this is the part worth reading, and the job log
      # is easiest to read from the end.
      - name: Render summary
        if: always()
        run: |
          cat render-report/summary.md
          cat render-report/summary.md >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to GitHub Pages
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # GITHUB_TOKEN cannot create the Pages site itself, so this step fails
      # until Pages has been switched on once in the repository settings.
      # Treat that as a skip rather than a red build: the render verification
      # above is the part that gates the branch.
      - name: Configure Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Pages is not enabled yet
        if: steps.pages.outcome == 'failure'
        run: |
          echo "::warning::GitHub Pages is not enabled for this repository, so the site was not published."
          echo "Enable it once under Settings -> Pages -> Build and deployment -> Source: GitHub Actions,"
          echo "then re-run this workflow and the deployment will go through."

      - id: deployment
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
